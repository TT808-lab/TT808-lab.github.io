<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Course Reader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root{--paper:#f4f0e5;--card:#fffdf7;--ink:#24231f;--muted:#6b665e;--line:#d9d0bf;--brand:#244b5b;--accent:#d4972b;--danger:#a33b2f;--playing:#f4d787}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif} .shell{max-width:760px;margin:auto;padding:16px 14px 110px}
    header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}h1{margin:0;font-size:21px} .sub{color:var(--muted);font-size:12px}.lang button{border:1px solid var(--line);background:var(--card);padding:5px 9px}.lang button.active{background:var(--brand);color:#fff}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button,.btn{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 12px;font-weight:600;cursor:pointer}.tabs button.active,.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.danger{color:var(--danger);border-color:var(--danger)}label{display:block;color:var(--muted);font-size:12px;margin-top:9px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px;font:inherit}textarea{min-height:180px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row .fit{flex:0 0 auto}.hint{color:var(--muted);font-size:12px}.status{color:var(--muted);font-size:12px;margin-top:8px}.error{color:var(--danger)}
    .library-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.library-item:last-child{border-bottom:0}.library-item strong{display:block}.library-item small{color:var(--muted)}
    .reader-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.reader-head h2{font-size:18px;margin:0}.pager{display:flex;align-items:center;gap:7px;margin:10px 0}.pager input{width:75px;text-align:center}.progress{height:7px;background:#e8dfcc;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0}.page-text{white-space:pre-wrap;font:18px/1.85 Georgia,"Songti SC",serif}.unit{padding:8px 6px;border-radius:6px;cursor:pointer}.unit.playing{background:var(--playing)}.translation{margin-top:6px;padding:8px;background:#f2f5ed;border-left:3px solid #70a276;white-space:pre-wrap}.bookmark{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0}.bookmark:last-child{border-bottom:0}
    .deck{position:fixed;left:0;right:0;bottom:0;background:#203844;color:#eef5f2;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px #0003}.deck-inner{max-width:760px;margin:auto}.deck select,.deck input{background:#2c4d58;color:#fff;border-color:#58717a}.deck .status{color:#c2d3d2}.deck .btn{background:#eef5f2;color:#203844;border:0}.deck .danger{background:transparent;color:#ffd1c8;border:1px solid #a97b75}
    @media(max-width:520px){.page-text{font-size:17px}.deck .row{gap:5px}.deck .row>*{min-width:0}.deck select{font-size:12px}.shell{padding-left:10px;padding-right:10px}}
  </style>
</head>
<body>
<main class="shell">
  <header><div><h1 data-zh="课程阅读器" data-en="Course Reader">课程阅读器</h1><div class="sub" data-zh="PDF 与粘贴文字 · 阅读、翻译、朗读" data-en="PDF and pasted text · read, translate, listen">PDF 与粘贴文字 · 阅读、翻译、朗读</div></div><div class="lang"><button id="langZh" class="active">中文</button><button id="langEn">EN</button></div></header>
  <section id="home">
    <div class="card"><div class="tabs"><button id="pdfTab" class="active" data-zh="导入 PDF" data-en="Import PDF">导入 PDF</button><button id="textTab" data-zh="粘贴文字" data-en="Paste text">粘贴文字</button></div>
      <div id="pdfForm"><label data-zh="书名" data-en="Title">书名</label><input id="pdfTitle" placeholder="例如：Ways of the World"><label data-zh="PDF 文件" data-en="PDF file">PDF 文件</label><input id="pdfFile" type="file" accept="application/pdf"><label data-zh="起始页（默认 1；将成为 30 页批次起点）" data-en="Starting page (default 1; anchor for 30-page batches)">起始页（默认 1；将成为 30 页批次起点）</label><input id="pdfStart" type="number" min="1" value="1"><button id="importPdf" class="btn primary" style="margin-top:12px" data-zh="导入并开始阅读" data-en="Import and start reading">导入并开始阅读</button><div id="pdfStatus" class="status"></div></div>
      <div id="textForm" class="hidden"><label data-zh="标题" data-en="Title">标题</label><input id="textTitle" placeholder="例如：My novel"><label data-zh="正文（保留原始段落）" data-en="Text (original paragraphs are preserved)">正文（保留原始段落）</label><textarea id="rawText" placeholder="Paste Chinese or English text here…"></textarea><label data-zh="正文语言" data-en="Content language">正文语言</label><select id="textLanguage"><option value="auto">自动检测 / Auto</option><option value="en">English</option><option value="zh">中文</option></select><button id="saveText" class="btn primary" style="margin-top:12px" data-zh="保存并开始阅读" data-en="Save and start reading">保存并开始阅读</button><div id="textStatus" class="status"></div></div>
    </div>
    <div class="card"><h2 data-zh="本机书架" data-en="Local library">本机书架</h2><div class="hint" data-zh="内容、进度、书签、翻译和语音偏好保存在本机浏览器。" data-en="Content, progress, bookmarks, translations and voice preferences stay in this browser.">内容、进度、书签、翻译和语音偏好保存在本机浏览器。</div><div id="library" style="margin-top:8px"></div></div>
  </section>
  <section id="reader" class="hidden">
    <div class="card"><div class="reader-head"><h2 id="readerTitle"></h2><button id="backHome" class="btn" data-zh="返回书架" data-en="Library">返回书架</button></div><div id="readerMeta" class="hint"></div><div class="pager"><button id="prevPage" class="btn fit">‹</button><input id="pageNumber" type="number" min="1"><span id="pageTotal"></span><button id="nextPage" class="btn fit">›</button></div><div class="progress"><i id="pageProgress"></i></div><div id="pageStatus" class="status"></div></div>
    <div class="card"><div class="row"><button id="translateBtn" class="btn primary fit" data-zh="翻译成中文" data-en="Translate to Chinese">翻译成中文</button><button id="retryBtn" class="btn fit hidden" data-zh="重试失败部分" data-en="Retry failed parts">重试失败部分</button><label class="fit" style="margin:0"><input id="showTranslation" type="checkbox" style="width:auto"> <span data-zh="显示译文" data-en="Show translation">显示译文</span></label></div><div id="translationStatus" class="status"></div><div id="content"></div></div>
    <div class="card"><h2 data-zh="书签" data-en="Bookmarks">书签</h2><div class="row"><input id="bookmarkName" placeholder="例如：关键转折 / Key turn"><button id="addBookmark" class="btn fit" data-zh="标记当前页" data-en="Bookmark page">标记当前页</button></div><div id="bookmarks" style="margin-top:8px"></div></div>
  </section>
</main>
<div class="deck"><div class="deck-inner"><div class="row"><button id="play" class="btn fit">▶</button><button id="pause" class="btn fit">Ⅱ</button><button id="stop" class="btn danger fit" data-zh="停止" data-en="Stop">停止</button><span class="hint" data-zh="速度" data-en="Rate">速度</span><input id="rate" type="range" min="0.5" max="2" step="0.05" value="1" style="max-width:130px"><output id="rateValue">1×</output></div><div class="row" style="margin-top:6px"><span class="hint" data-zh="音色" data-en="Voice">音色</span><select id="voice"></select></div><div id="speechStatus" class="status"></div></div></div>
<script type="module" src="./app.mjs"></script>
</body></html>
