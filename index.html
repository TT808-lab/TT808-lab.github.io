<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工具箱</title>
<style>
  :root{
    --paper: #EFEBDD;
    --card: #F7F4EA;
    --ink: #26241F;
    --ink-soft: #6E6659;
    --rule: #D9D2BF;
    --accent: #2F4858;
    --highlight: #E8B84B;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width:560px; margin:0 auto; padding:32px 18px 60px; }
  h1{
    font-family:"Noto Serif SC","Songti SC",serif;
    font-size:24px; margin:0 0 4px;
  }
  .sub{ color:var(--ink-soft); font-size:13px; margin:0 0 26px; }
  ul{ list-style:none; margin:0; padding:0; }
  li{ margin-bottom:12px; }
  a.tool{
    display:block; background:var(--card); border:1px solid var(--rule);
    border-left:3px solid var(--highlight);
    border-radius:10px; padding:14px 16px; text-decoration:none; color:var(--ink);
  }
  a.tool .name{ font-weight:700; font-size:15.5px; }
  a.tool .desc{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  footer{ margin-top:30px; font-size:11.5px; color:var(--ink-soft); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>工具箱</h1>
  <p class="sub">自用小工具合集</p>
  <ul>
    <li>
      <a class="tool" href="tools/course-reader/">
        <div class="name">课程阅读器</div>
        <div class="desc">PDF 转逐页图片,本地保存,逐句英文朗读</div>
      </a>
    </li>
    <!-- 新工具照这个格式往下加一条 <li>,href 换成 tools/工具文件夹名/ -->
  </ul>
  <footer>点开任意工具即可使用</footer>
</div>
</body>
</html>
